name: oot-windows

# Builds "OOT Remake.exe" for Windows and uploads it as a workflow artifact (no public release).
on:
  workflow_dispatch:
  push:
    branches:
      - zelda-only
      - main
    paths:
      - "src/**"
      - "!src/tests/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "externals/**"
      - "dist/**"
      - "cpmfile.json"
      - ".github/workflows/oot-windows.yml"

permissions:
  contents: read

concurrency:
  group: oot-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x86_64
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install sccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          $url = 'https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip'
          # GitHub release downloads time out now and then (504): retry with a growing delay.
          for ($attempt = 1; ; $attempt++) {
            try { Invoke-WebRequest -OutFile $zip $url; break }
            catch {
              if ($attempt -ge 6) {
                # Build without the compiler cache rather than not at all.
                Write-Host "::warning::sccache unavailable, building without it"
                "SCCACHE_LAUNCHER=" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
                exit 0
              }
              Write-Host "sccache download failed ($_), retry $attempt"
              Start-Sleep -Seconds (15 * $attempt)
            }
          }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "SCCACHE_LAUNCHER=sccache" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-oot-windows-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-oot-windows-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: .sccache
          key: objects-oot-windows-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            objects-oot-windows-

      - name: Configure
        shell: bash
        # CPM downloads dependencies from GitHub releases, which time out now and then: retry.
        run: >-
          for attempt in 1 2 3 4 5; do
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=OFF
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DLICHII_BUILD_TAG=oot-${{ github.run_number }}
          -DLICHII_BUILD_PLATFORM=windows-x86_64
          -DUSE_DISCORD_PRESENCE=OFF
          -DLICHII_LINK_ICF=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=$SCCACHE_LAUNCHER
          -DCMAKE_CXX_COMPILER_LAUNCHER=$SCCACHE_LAUNCHER
          && break;
          [ "$attempt" = 5 ] && exit 1;
          echo "configure failed, retry $attempt"; sleep $((30 * attempt));
          done

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        shell: bash
        run: |
          if [ -n "$SCCACHE_LAUNCHER" ]; then sccache --zero-stats; fi
          cmake --build build/release --target yuzu --parallel -- -k 0
          if [ -n "$SCCACHE_LAUNCHER" ]; then sccache --show-stats; fi

      - name: Stop sccache
        if: always() && steps.compiler-cache.outcome == 'success' && env.SCCACHE_LAUNCHER != ''
        shell: pwsh
        run: sccache --stop-server

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Package
        shell: pwsh
        run: |
          if (-not (Test-Path "build/release/bin/OOT Remake.exe")) {
            throw "OOT Remake.exe was not produced"
          }
          windeployqt --release --no-translations --no-compiler-runtime "build/release/bin/OOT Remake.exe"
          Remove-Item -ErrorAction SilentlyContinue "build/release/bin/vc_redist*.exe"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: OOT-Remake-windows-${{ github.sha }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 14
